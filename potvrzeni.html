<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potvrzení o úhradě nájemného</title>
<style>
  :root{
    --bg:#f4f4f2; --card:#ffffff; --ink:#1c1c1a; --muted:#6b6b66;
    --line:#dedcd6; --accent:#8a6d1f; --accent-soft:#fffbe8; --focus:#b08d2a;
    --ok:#2f6b3a; --err:#a33227;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17171a; --card:#1f1f23; --ink:#eceae4; --muted:#9c9a93;
      --line:#33333a; --accent:#d9b755; --accent-soft:#2a2617; --focus:#d9b755;
      --ok:#7fc08c; --err:#e88b7f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  .wrap{max-width:660px;margin:0 auto;padding:28px 18px 80px}
  header h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  header p{margin:0 0 26px;color:var(--muted);font-size:14px}
  fieldset{border:1px solid var(--line);border-radius:10px;background:var(--card);
    margin:0 0 16px;padding:16px 18px 18px}
  legend{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);padding:0 6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .grid .full{grid-column:1/-1}
  @media (max-width:560px){ .grid{grid-template-columns:1fr} }
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=text],input[type=number],select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
  input:focus,select:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
  .hidden{display:none}
  .nahled{
    background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-top:4px;font-size:14px;line-height:1.55;
  }
  .nahled strong{font-weight:600}
  .bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 62%,transparent);
    padding:16px 0 10px;margin-top:6px}
  button{width:100%;padding:14px 18px;border:0;border-radius:9px;background:var(--accent);
    color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
  @media (prefers-color-scheme: dark){ button{color:#17171a} }
  button:hover{filter:brightness(1.07)}
  button[disabled]{opacity:.6;cursor:default}
  #msg{margin-top:10px;font-size:14px;min-height:20px;text-align:center}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Potvrzení o úhradě nájemného</h1>
  <p>Vyber nájemce a období, stáhne se hotové potvrzení v PDF s podpisem.</p>
</header>

<form id="f" autocomplete="off">

<fieldset>
  <legend>Nájemce</legend>
  <div class="grid">
    <div class="full">
      <label for="najemce">Kdo</label>
      <select id="najemce"></select>
    </div>
  </div>
  <div id="rucne" class="hidden" style="margin-top:12px">
    <div class="grid">
      <div class="full">
        <label for="jmeno">Jméno a datum narození</label>
        <input type="text" id="jmeno" placeholder="Jan Novák, nar. 1.1.1990">
      </div>
      <div class="full">
        <label for="adresa">Adresa</label>
        <input type="text" id="adresa" placeholder="Ulice 1/2, 700 00 Ostrava">
      </div>
      <div>
        <label for="typ">Jde o</label>
        <select id="typ">
          <option value="bytu">byt</option>
          <option value="domu">dům</option>
        </select>
      </div>
    </div>
  </div>
</fieldset>

<fieldset>
  <legend>Období</legend>
  <div class="grid">
    <div>
      <label for="mesic">Měsíc</label>
      <select id="mesic"></select>
    </div>
    <div>
      <label for="rok">Rok</label>
      <input type="number" id="rok" min="2020" max="2100" step="1">
    </div>
  </div>
</fieldset>

<fieldset>
  <legend>Podpis</legend>
  <div class="grid">
    <div>
      <label for="misto">Místo</label>
      <input type="text" id="misto" value="Ostravě">
      <div class="hint">Doplní se do „V … dne".</div>
    </div>
    <div>
      <label for="datum">Datum vystavení</label>
      <input type="text" id="datum">
    </div>
    <div class="full">
      <label for="role">Podepisuji jako</label>
      <select id="role">
        <option value="Pronajímatel">Pronajímatel</option>
        <option value="jednatel keke s.r.o.">jednatel keke s.r.o.</option>
      </select>
    </div>
  </div>
</fieldset>

<fieldset>
  <legend>Náhled textu</legend>
  <div class="nahled" id="nahled"></div>
</fieldset>

<div class="bar">
  <button type="submit">Vygenerovat potvrzení</button>
  <div id="msg"></div>
</div>

</form>
</div>

<script>
const $ = id => document.getElementById(id);

const MESICE = ['leden','únor','březen','duben','květen','červen',
                'červenec','srpen','září','říjen','listopad','prosinec'];

// --- naplnit číselníky ---
NAJEMCI.forEach((n, i) => {
  const o = document.createElement('option');
  o.value = String(i);
  o.textContent = n.label + ' — ' + n.adresa;
  $('najemce').appendChild(o);
});
{
  const o = document.createElement('option');
  o.value = 'rucne';
  o.textContent = '— jiný, vyplním ručně —';
  $('najemce').appendChild(o);
}

MESICE.forEach((m, i) => {
  const o = document.createElement('option');
  o.value = String(i + 1).padStart(2, '0');
  o.textContent = o.value + ' — ' + m;
  $('mesic').appendChild(o);
});

// --- výchozí hodnoty: minulý měsíc, dnešní datum ---
(function () {
  const dnes = new Date();
  const min = new Date(dnes.getFullYear(), dnes.getMonth() - 1, 1);
  $('mesic').value = String(min.getMonth() + 1).padStart(2, '0');
  $('rok').value = min.getFullYear();
  const dd = String(dnes.getDate()).padStart(2, '0');
  const mm = String(dnes.getMonth() + 1).padStart(2, '0');
  $('datum').value = dd + '.' + mm + '.' + dnes.getFullYear();
})();

function vybrany(){
  const v = $('najemce').value;
  if (v === 'rucne'){
    return { jmeno: $('jmeno').value.trim(), adresa: $('adresa').value.trim(), typ: $('typ').value };
  }
  const n = NAJEMCI[Number(v)];
  return { jmeno: n.jmeno, adresa: n.adresa, typ: n.typ };
}

function data(){
  const n = vybrany();
  return {
    typ: n.typ,
    najemce: n.jmeno,
    adresa: n.adresa,
    obdobi: $('mesic').value + '/' + $('rok').value,
    misto: $('misto').value.trim(),
    datum: $('datum').value.trim(),
    role: $('role').value
  };
}

function prijmeni(jmeno){
  const cast = jmeno.split(',')[0].trim().split(/\s+/);
  return cast[cast.length - 1] || 'najemce';
}

function nazevSouboru(d){
  return 'Potvrzení o úhradě nájemného - ' + prijmeni(d.najemce) + ' '
       + d.obdobi.replace('/', '-') + '.pdf';
}

function prekresli(){
  const d = data();
  $('rucne').classList.toggle('hidden', $('najemce').value !== 'rucne');
  $('nahled').innerHTML =
    '<strong>Potvrzení o řádné úhradě nájemného</strong><br><br>' +
    'Nájemce ' + d.typ + ': ' + (d.najemce || '…') + '<br>' +
    'Adresa ' + d.typ + ': ' + (d.adresa || '…') + '<br><br>' +
    'Tímto potvrzuji, že nájemce má řádně uhrazené nájemné i služby za ' + d.obdobi + '.<br><br>' +
    'V ' + d.misto + ' dne ' + d.datum + '<br><br>' +
    'Ing. Martin Mucha<br><em>' + d.role + '</em>';
}
$('f').addEventListener('input', prekresli);
$('f').addEventListener('change', prekresli);
prekresli();

function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function stahni(bytes, jmeno, typ){
  const url = URL.createObjectURL(new Blob([bytes], { type: typ }));
  const a = document.createElement('a');
  a.href = url;
  a.download = jmeno;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const msg = $('msg');
  const btn = $('f').querySelector('button');
  msg.className = '';
  msg.textContent = '';

  const d = data();
  if (!d.najemce || !d.adresa){
    msg.className = 'err';
    msg.textContent = 'Vyplň jméno a adresu nájemce.';
    return;
  }

  let docx;
  try{
    const doc = new window.docxtemplater(new PizZip(b64ToBytes(TPL_B64)),
      { paragraphLoop: true, linebreaks: true });
    doc.render(d);
    docx = doc.getZip().generate({ type: 'base64', compression: 'DEFLATE' });
  } catch (e){
    msg.className = 'err';
    msg.textContent = 'Chyba při sestavení dokumentu: ' + (e && e.message ? e.message : e);
    console.error(e);
    return;
  }

  btn.disabled = true;
  msg.textContent = 'Připravuji PDF…';

  const nazev = nazevSouboru(d);
  try{
    const odpoved = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        klic: KLIC,
        nazev: nazev.replace(/\.pdf$/i, ''),
        nepodepsany: docx,
        podepsany: ''          // prázdné = skript neposílá žádný mail
      })
    });
    const v = await odpoved.json();
    if (!v.ok) throw new Error(v.chyba || 'neznámá chyba');
    stahni(b64ToBytes(v.pdf), nazev, 'application/pdf');
    msg.className = 'ok';
    msg.textContent = 'Hotovo – ' + nazev;
  } catch (e){
    stahni(b64ToBytes(docx), nazev.replace(/\.pdf$/i, '.docx'),
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    msg.className = 'ok';
    msg.textContent = 'Hotovo – ' + nazev.replace(/\.pdf$/i, '.docx')
      + ' (PDF se nepodařilo vytvořit, stáhl se Word)';
    console.error(e);
  } finally {
    btn.disabled = false;
  }
});
</script>
